name: Data Update

on:
  schedule:
    # 10:00 KST
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force data regeneration even when the remote version is unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: "data-update"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'

      - name: Install protocol documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Update data
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python main.py
          else
            python main.py --skip-if-current
          fi

      - name: Validate generated data
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q main.py src tests
          python - <<'PY'
          import json
          from pathlib import Path

          count = 0
          for root in (Path("data"), Path("raw")):
              for path in root.rglob("*.json"):
                  json.loads(path.read_text(encoding="utf-8"))
                  count += 1
          print(f"json ok: {count}")
          PY
          files=$(find data/protocol/proto -maxdepth 1 -name '*.proto' -printf '%f\n' | sort)
          protoc --proto_path=data/protocol/proto --descriptor_set_out=/tmp/majsoul_protocol.desc $files

      - name: Commit and push changes
        id: commit_changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ raw/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
