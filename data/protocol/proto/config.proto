syntax = "proto3";

package lq.config;

message ConfigTables {
  string version = 1;
  string header_hash = 2;
  repeated .lq.config.TableSchema schemas = 3;
  repeated .lq.config.SheetData datas = 4;
}

message Field {
  string field_name = 1;
  uint32 array_length = 2;
  string pb_type = 3;
  uint32 pb_index = 4;
}

message SheetData {
  string table = 1;
  string sheet = 2;
  repeated bytes data = 3;
}

message SheetMeta {
  string category = 1;
  string key = 2;
}

message SheetSchema {
  string name = 1;
  .lq.config.SheetMeta meta = 2;
  repeated .lq.config.Field fields = 3;
}

message TableSchema {
  string name = 1;
  repeated .lq.config.SheetSchema sheets = 2;
}
